name: Stack
# Builds the programs that have no portable download for Linux and macOS (Apache, PHP, MariaDB) and publishes them as
# release "stack-<tag>". Run by hand when a version changes: Actions > Stack > Run workflow.
on:
  push:
    branches: [crossplatform]
    paths: ["scripts/stack/**", ".github/workflows/stack.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Stack number (the release becomes stack-<number>)"
        required: true
        default: "1"
      only:
        description: "Build only this program (apache, php or mariadb); empty builds all"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - { plat: linux-x86_64, runner: ubuntu-22.04, sp: linux-x86_64 }
          - { plat: linux-aarch64, runner: ubuntu-22.04-arm, sp: linux-aarch64 }
          - { plat: macos-aarch64, runner: macos-14, sp: macos-aarch64 }
        prog: [apache, php, mariadb]
    runs-on: ${{ matrix.os.runner }}
    steps:
      - name: Skip programs that were not asked for
        id: want
        run: echo "go=${{ (inputs.only == '' || inputs.only == matrix.prog) && 'yes' || 'no' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - name: On a push build what scripts/stack/only.txt names, or everything when it is empty
        if: github.event_name == 'push'
        id: want_push
        run: |
          only=$(tr -d '[:space:]' < scripts/stack/only.txt 2>/dev/null || true)
          if [ -z "$only" ] || [ "$only" = "${{ matrix.prog }}" ]; then echo "go=yes" >> "$GITHUB_OUTPUT"; else echo "go=no" >> "$GITHUB_OUTPUT"; fi
      - name: Build tools (Linux)
        if: (steps.want_push.outputs.go == 'yes' || (github.event_name != 'push' && steps.want.outputs.go == 'yes')) && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake bison libncurses-dev libexpat1-dev pkg-config perl curl bzip2
      - name: Build tools (macOS)
        if: (steps.want_push.outputs.go == 'yes' || (github.event_name != 'push' && steps.want.outputs.go == 'yes')) && runner.os == 'macOS'
        run: |
          brew install cmake bison pkg-config
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
      - name: Build ${{ matrix.prog }}
        if: (steps.want_push.outputs.go == 'yes' || (github.event_name != 'push' && steps.want.outputs.go == 'yes'))
        run: |
          chmod +x scripts/stack/*.sh
          if [ "${{ matrix.prog }}" = php ]; then scripts/stack/build-php.sh "${{ matrix.os.plat }}" "${{ matrix.os.sp }}"; else scripts/stack/build-${{ matrix.prog }}.sh "${{ matrix.os.plat }}"; fi
      - uses: actions/upload-artifact@v4
        if: (steps.want_push.outputs.go == 'yes' || (github.event_name != 'push' && steps.want.outputs.go == 'yes'))
        with:
          name: ${{ matrix.prog }}-${{ matrix.os.plat }}
          path: dist/*.tar.gz
  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release stack-${{ inputs.tag || '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          python3 ../scripts/stack/stack-json.py . "${{ inputs.tag || '1' }}"
          gh release create "stack-${{ inputs.tag || '1' }}" --repo "$GITHUB_REPOSITORY" --prerelease --title "Stack ${{ inputs.tag || '1' }}" \
            --notes "Apache, PHP and MariaDB builds for Linux and macOS that Runqora installs. Built by the Stack workflow." *.tar.gz stack.json \
            || gh release upload "stack-${{ inputs.tag || '1' }}" --repo "$GITHUB_REPOSITORY" --clobber *.tar.gz stack.json
  e2e:
    needs: build
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - { plat: linux-x86_64, runner: ubuntu-22.04 }
          - { plat: linux-aarch64, runner: ubuntu-22.04-arm }
          - { plat: macos-aarch64, runner: macos-14 }
    runs-on: ${{ matrix.os.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-${{ matrix.os.plat }}"
          path: dist
          merge-multiple: true
      - name: Do all three bundles exist?
        id: have
        run: |
          ls -l dist || true
          if ls dist/apache-* dist/php-* dist/mariadb-* >/dev/null 2>&1; then echo "all=yes" >> "$GITHUB_OUTPUT"; else echo "all=no" >> "$GITHUB_OUTPUT"; fi
      - name: Linux libraries
        if: steps.have.outputs.all == 'yes' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev patchelf libssl-dev curl
      - uses: dtolnay/rust-toolchain@stable
        if: steps.have.outputs.all == 'yes'
      - uses: Swatinem/rust-cache@v2
        if: steps.have.outputs.all == 'yes'
        with:
          workspaces: app/src-tauri
      - name: Build rq
        if: steps.have.outputs.all == 'yes'
        working-directory: app/src-tauri
        run: cargo build --bin rq
      - name: Install from the new bundles and test the whole stack
        if: steps.have.outputs.all == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/stack/stack-json.py dist local
          (cd dist && python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          python3 scripts/gen-unix-manifest.py --stack dist/stack.json --url-base http://127.0.0.1:8765 --out "$RUNNER_TEMP/manifest.json"
          chmod +x e2e/unix.sh
          e2e/unix.sh "$PWD/app/src-tauri/target/debug/rq" "$RUNNER_TEMP/manifest.json"
