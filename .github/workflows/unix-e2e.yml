name: Unix end-to-end
# Installs the stack bundles of an earlier Stack run (its number is in scripts/stack/stack-run.txt) with the current Runqora
# and tests Apache, PHP, MariaDB and phpMyAdmin through the command line. Fast to repeat while Runqora itself changes.
on:
  push:
    branches: [crossplatform]
    paths: ["app/src-tauri/**", "e2e/unix.sh", "scripts/stack/stack-run.txt", "scripts/gen-unix-manifest.py", ".github/workflows/unix-e2e.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: unix-e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os:
          - { plat: linux-x86_64, runner: ubuntu-22.04 }
          - { plat: linux-aarch64, runner: ubuntu-22.04-arm }
          - { plat: macos-aarch64, runner: macos-14 }
    runs-on: ${{ matrix.os.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the bundles of the Stack run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(tr -d '[:space:]' < scripts/stack/stack-run.txt)
          mkdir dist
          for p in apache php mariadb; do gh run download "$run" --repo "$GITHUB_REPOSITORY" -n "$p-${{ matrix.os.plat }}" -D dist; done
          ls -l dist
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev patchelf libssl-dev curl
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Build rq
        working-directory: app/src-tauri
        run: cargo build --bin rq
      - name: Install from the bundles and test the whole stack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/stack/stack-json.py dist local
          (cd dist && python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          python3 scripts/gen-unix-manifest.py --stack dist/stack.json --url-base http://127.0.0.1:8765 --out "$RUNNER_TEMP/manifest.json"
          chmod +x e2e/unix.sh
          e2e/unix.sh "$PWD/app/src-tauri/target/debug/rq" "$RUNNER_TEMP/manifest.json"
