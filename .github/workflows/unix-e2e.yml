name: Unix end-to-end
# Installs the stack bundles of an earlier Stack run (its number is in e2e/stack-run.txt) with the current Runqora
# and tests Apache, PHP, MariaDB and phpMyAdmin through the command line. Fast to repeat while Runqora itself changes.
on:
  push:
    branches: [crossplatform]
    paths: ["app/src-tauri/**", "e2e/unix.sh", "e2e/stack-run.txt", "scripts/gen-unix-manifest.py", ".github/workflows/unix-e2e.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: unix-e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os:
          - { plat: linux-x86_64, runner: ubuntu-22.04 }
          - { plat: linux-aarch64, runner: ubuntu-22.04-arm }
          - { plat: macos-aarch64, runner: macos-14 }
    runs-on: ${{ matrix.os.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the bundles of the Stack run (unless the file says "published")
        if: hashFiles('e2e/stack-run.txt') != '' && !startsWith(hashFiles('e2e/stack-run.txt'), 'x')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          if [ "$(head -1 e2e/stack-run.txt | tr -d '[:space:]')" = published ]; then echo "using the published stack-1 release"; exit 0; fi
          # e2e/stack-run.txt: one line per program, "<program> <Stack run number>"
          while read -r p run; do [ -n "$p" ] && gh run download "$run" --repo "$GITHUB_REPOSITORY" -n "$p-${{ matrix.os.plat }}" -D dist; done < e2e/stack-run.txt
          ls -l dist
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev patchelf libssl-dev curl libnss3-tools
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Build rq
        working-directory: app/src-tauri
        run: cargo build --bin rq
      - name: Install and test the whole stack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(head -1 e2e/stack-run.txt | tr -d '[:space:]')" = published ]; then
            m=app/src-tauri/manifest.unix.json
          else
            python3 scripts/stack/stack-json.py dist local
            (cd dist && python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
            python3 scripts/gen-unix-manifest.py --stack dist/stack.json --url-base http://127.0.0.1:8765 --out "$RUNNER_TEMP/manifest.json"
            m="$RUNNER_TEMP/manifest.json"
          fi
          chmod +x e2e/unix.sh
          e2e/unix.sh "$PWD/app/src-tauri/target/debug/rq" "$(realpath "$m")" apache php mariadb phpmyadmin composer node adminer mailpit jre tomcat sftpgo wordpress
