name: Packages
# Builds the Linux packages and the macOS disk image the way a release does, and starts the app once to see that it runs.
on:
  push:
    branches: [crossplatform]
    paths: ["app/**", ".github/workflows/package.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os:
          - { plat: linux-x86_64, runner: ubuntu-22.04, bundles: "deb,appimage" }
          - { plat: linux-aarch64, runner: ubuntu-22.04-arm, bundles: "deb,appimage" }
          - { plat: macos-aarch64, runner: macos-14, bundles: "dmg" }
    runs-on: ${{ matrix.os.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev patchelf libssl-dev xdg-utils xvfb dbus-x11 libfuse2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Build the packages
        working-directory: app/src-tauri
        run: |
          cargo build --release
          npx --yes @tauri-apps/cli@2.12.4 build --bundles ${{ matrix.os.bundles }}
      - name: What was made
        run: find app/src-tauri/target/release/bundle -maxdepth 2 -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' \) -exec ls -l {} \;
      - name: Start the installed app (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./app/src-tauri/target/release/bundle/deb/*.deb
          which runqora rq
          rq status | head -3
          export RUNQORA_DIR="$RUNNER_TEMP/rq-smoke"
          dbus-run-session -- xvfb-run -a bash -c 'runqora --hidden & pid=$!; sleep 12; if kill -0 $pid 2>/dev/null; then echo "the app is running"; kill $pid; else echo "the app exited early"; wait $pid; exit 1; fi'
      - name: Start the app from the disk image (macOS)
        if: runner.os == 'macOS'
        run: |
          hdiutil attach app/src-tauri/target/release/bundle/dmg/*.dmg -nobrowse -mountpoint "$RUNNER_TEMP/rqdmg"
          app="$RUNNER_TEMP/rqdmg/Runqora.app"
          ls "$app/Contents/MacOS"
          codesign -dv "$app" 2>&1 | head -5 || true
          export RUNQORA_DIR="$RUNNER_TEMP/rq-smoke"
          "$app/Contents/MacOS/rq" status | head -3
          "$app/Contents/MacOS/runqora" --hidden & pid=$!
          sleep 12
          if kill -0 $pid 2>/dev/null; then echo "the app is running"; kill $pid; else echo "the app exited early"; wait $pid; exit 1; fi
          hdiutil detach "$RUNNER_TEMP/rqdmg" || true
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os.plat }}
          path: |
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/dmg/*.dmg
